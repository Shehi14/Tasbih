
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Tasbih Counter</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>☪ Digital Tasbih</h1>

        <p class="subtitle">
            Remember Allah, Every Moment
        </p>

        <!-- Tasbih Counter -->

        <div class="tasbih-circle">

            <h2 id="counter">0</h2>

            <p>COUNT</p>

        </div>

        <!-- Target Selection -->

        <div class="target">

            <label>Select Target:</label>

            <select id="target">

                <option value="33">33</option>

                <option value="34">34</option>
        
                <option value="100">100</option>

                <option value="1000">1000</option>

            </select>

        </div>

        <!-- Counter Buttons -->

        <div class="buttons">

            <button id="countBtn">
                + Tasbih
            </button>

            <button id="resetBtn">
                Reset
            </button>

        </div>

        <p id="message">
            Start your Tasbih
        </p>

        <!-- Timer Section -->

        <div class="timer">

            <h3>Timer</h3>

            <h2 id="time">00:00</h2>

            <button id="startBtn">
                Start Timer
            </button>

            <button id="stopBtn">
                Stop Timer
            </button>

        </div>

    </div>

    <script src="index.js"></script>
    <script src="index.css"></script>

</body>

</html>
